[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soctriage"
version = "1.0.0"
description = "Local and hosted models for SOC alert triage under limited human review: code, released results and reproduction"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Yaniv Zimmer" }, { name = "Yuval Goldberg" }, { name = "Noam Cohen" }]
requires-python = ">=3.10"
# The paper's analysis (python -m soctriage.analysis) needs only the standard library.
dependencies = []

[project.optional-dependencies]
# Figure 1
figures = ["matplotlib>=3.8"]
# Rebuild and validate the GUIDE benchmark (scripts/reproduce_guide.sh, steps 1-4)
guide = ["numpy==2.2.6", "pandas==2.3.3", "scikit-learn==1.8.0", "pyyaml==6.0.3", "pydantic==2.12.5"]
# Retrain the local models (versions of the environment that produced the paper's runs; Python 3.10-3.12)
train = [
  "soctriage[guide]",
  "torch==2.4.1", "transformers==4.54.1", "peft==0.18.0", "datasets==4.4.2", "accelerate==1.12.0",
  "sentence-transformers==5.2.0", "setfit==1.1.3", "lightgbm==4.6.0", "scipy==1.16.3",
]
# Re-query the hosted models (API keys from the environment)
hosted = ["httpx==0.28.1", "anthropic"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["soctriage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
